# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest
  
  post-build:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
    - uses: actions/checkout@v4
    - name: Post-build notification (example)
      run: |
        echo "Build job finished for commit $GITHUB_SHA"
        echo "Workflow run: $GITHUB_RUN_ID"

  validate-dev:
    needs: post-build
    runs-on: ubuntu-latest
    if: ${{ needs.post-build.result == 'success' }}
    steps:
    - uses: actions/checkout@v4
    - name: Validate - DEV
      run: |
        echo "Running DEV validations..."
        # add real validation commands here
        echo "DEV validation passed"

  validate-uat:
    needs: post-build
    runs-on: ubuntu-latest
    if: ${{ needs.post-build.result == 'success' }}
    steps:
    - uses: actions/checkout@v4
    - name: Validate - UAT
      run: |
        echo "Running UAT validations..."
        # add real validation commands here
        echo "UAT validation passed"

  validate-prod:
    needs: post-build
    runs-on: ubuntu-latest
    if: ${{ needs.post-build.result == 'success' }}
    environment: production
    steps:
    - uses: actions/checkout@v4
    - name: Validate - PROD
      run: |
        echo "Running PROD validations..."
        # add real validation commands here
        echo "PROD validation passed"
